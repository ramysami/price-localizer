<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Price Localizer – popup preview</title>
  </head>
  <body>
    <!-- Renders the real popup/popup.html outside Chrome, with the extension APIs stubbed. -->
    <script>
      const now = Date.now();
      const store = {
        sync: {
          settings: {
            enabled: true, targetCurrency: 'EGP', color: '#16a34a', dollarCurrency: 'auto',
            currencyDisplay: 'symbol', roundWhole: false, showTooltip: true, disabledSites: [],
          },
        },
        local: {
          rates: {
            base: 'USD', provider: 'ExchangeRate-API', providerUrl: 'https://www.exchangerate-api.com',
            updatedAt: now - 13 * 3600e3, nextUpdateAt: now + 11 * 3600e3, fetchedAt: now - 600e3,
            rates: {
              USD: 1, EGP: 51.378, EUR: 0.862246, GBP: 0.739483, SAR: 3.75, AED: 3.6725, KWD: 0.3057, QAR: 3.64,
              TRY: 48.61, INR: 95.61, JPY: 153.61, CNY: 7.12, CAD: 1.3976, AUD: 1.3976, CHF: 0.8, BRL: 5.4, MXN: 18.6,
            },
          },
          rateStatus: null,
        },
      };
      const pick = (area, keys) =>
        Object.fromEntries([].concat(keys).filter((k) => store[area][k] !== undefined).map((k) => [k, store[area][k]]));
      window.chrome = {
        storage: {
          sync: { get: async (k) => pick('sync', k), set: async (obj) => Object.assign(store.sync, obj) },
          local: { get: async (k) => pick('local', k) },
          onChanged: { addListener() {} },
        },
        runtime: { sendMessage: () => new Promise((r) => setTimeout(() => r({ ok: true }), 600)) },
        tabs: {
          query: async () => [{ id: 1, url: 'https://www.amazon.com/dp/B0EXAMPLE' }],
          sendMessage: async () => ({ hostname: 'www.amazon.com', active: true, count: 37 }),
        },
      };

      (async () => {
        const html = await (await fetch('../popup/popup.html')).text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const base = document.createElement('base');
        base.href = new URL('../popup/', location.href).href;
        document.head.append(base);
        doc.querySelectorAll('link[rel=stylesheet]').forEach((l) => document.head.append(l));
        const scripts = [...doc.querySelectorAll('script[src]')].map((s) => s.getAttribute('src'));
        doc.querySelectorAll('script').forEach((s) => s.remove());
        document.body.innerHTML = doc.body.innerHTML;
        for (const src of scripts) {
          await new Promise((resolve) => {
            const el = document.createElement('script');
            el.src = src;
            el.onload = resolve;
            document.body.append(el);
          });
        }
      })();
    </script>
  </body>
</html>
